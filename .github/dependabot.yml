version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current; Dependabot
  # rewrites both the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Cargo.lock is committed and release builds use --locked, so dependency
  # changes reach release binaries only through these reviewable PRs.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
