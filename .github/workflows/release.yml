name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.0.1)'
        required: true
        type: string

# Least privilege by default; each job below asks only for what its steps use.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate tag matches Cargo.toml version
        shell: bash
        # The dispatch input reaches the script only through the environment,
        # never through expression expansion, and is rejected unless it is exactly
        # vMAJOR.MINOR.PATCH before any other use.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          STRIPPED_TAG="${TAG#v}"
          if [ "$STRIPPED_TAG" != "$VERSION" ]; then
            echo "Error: Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
          if ! echo "$STRIPPED_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be SemVer MAJOR.MINOR.PATCH (got '$STRIPPED_TAG')"
            exit 1
          fi
          echo "Validated: Tag $TAG matches Cargo.toml version $VERSION ($STRIPPED_TAG)"

  build:
    needs: preflight
    env:
      __COMPAT_LAYER: RunAsInvoker
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (native MSVC on the windows runner; arm64 cross-compiles).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: nano-amd64.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            asset: nano-arm64.exe
          # Linux (native on each runner; musl = fully static, portable across
          # distros — important for a self-updating binary).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: nano-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: nano-linux-arm64

    runs-on: ${{ matrix.os }}
    # This job compiles third-party crates (build scripts and proc macros run
    # here), so its token stays read-only.  Provenance is attested in the
    # release job, over the same signed bytes uploaded below.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; else ext=""; fi
          cp "target/${{ matrix.target }}/release/nano${ext}" "${{ matrix.asset }}"

      - name: Sign with Fara Technologies LLC (primary)
        if: contains(matrix.target, 'windows')
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://eus.codesigning.azure.net/'
          trusted-signing-account-name: 'faraCodeSigningBusiness'
          certificate-profile-name: 'Faratech'
          files: |
            ${{ github.workspace }}\${{ matrix.asset }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Append Mike Fara signature
        if: contains(matrix.target, 'windows')
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://eus.codesigning.azure.net/'
          trusted-signing-account-name: 'fara-codesigning'
          certificate-profile-name: 'MikeFara'
          files: |
            ${{ github.workspace }}\${{ matrix.asset }}
          append-signature: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify both embedded signatures
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $tool) { throw 'x64 signtool.exe not found' }
          $files = @(Get-Item -LiteralPath '${{ matrix.asset }}')
          if ($files.Count -eq 0) { throw 'No signed executables found' }
          foreach ($file in $files) {
            & $tool.FullName verify /pa /all /v $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $file" }
            & $tool.FullName verify /pa /ds 1 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Second signature missing or invalid: $file" }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the provenance attestation
      attestations: write  # store the provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # Need full history to access tag annotations

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true  # Attestation only works for public repos
        with:
          subject-path: |
            artifacts/nano-amd64.exe
            artifacts/nano-arm64.exe
            artifacts/nano-linux-amd64
            artifacts/nano-linux-arm64

      - name: Get tag message
        id: tag_message
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Get the tag annotation message (excludes the tag name line)
          MESSAGE=$(git tag -l --format='%(contents)' "$TAG")
          # Write to file to preserve newlines
          echo "$MESSAGE" > release_notes.md
          cat >> release_notes.md << 'EOF'

          ### Verification

          All release binaries are verified with GitHub artifact attestation:

          ```bash
          # Windows
          gh attestation verify nano-amd64.exe --owner faratech
          gh attestation verify nano-arm64.exe --owner faratech

          # Linux
          gh attestation verify nano-linux-amd64 --owner faratech
          gh attestation verify nano-linux-arm64 --owner faratech
          ```
          EOF
          echo "Generated release notes for $TAG"

      - name: Generate SHA-256 manifest
        run: |
          cd artifacts
          sha256sum \
            nano-amd64.exe \
            nano-arm64.exe \
            nano-linux-amd64 \
            nano-linux-arm64 > nano-checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: nano-rs ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            artifacts/nano-amd64.exe
            artifacts/nano-arm64.exe
            artifacts/nano-linux-amd64
            artifacts/nano-linux-arm64
            artifacts/nano-checksums.txt
          body_path: release_notes.md
