name: Broad PTY integrity

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seed:
        description: Random seed (decimal or 0x-prefixed)
        required: false
        default: "0x4E414E4F"

permissions:
  contents: read

concurrency:
  group: pty-integrity-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  broad-pty-integrity:
    name: Seeded and 1 MiB PTY byte integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pty-broad-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: Build pinned GNU nano reference
        # The runner image's nano moves underneath us (an image bump changes
        # reference behavior and reds the suite). Build a fixed version from
        # source so both sides of the comparison are reproducible.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential ncurses-dev
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nano.tar.xz" \
            https://ftp.gnu.org/gnu/nano/nano-7.2.tar.xz
          tar -xJ -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/nano.tar.xz"
          cd "$RUNNER_TEMP/nano-7.2"
          ./configure --prefix="$RUNNER_TEMP/nano-ref" --disable-nls >/dev/null
          make -j2 >/dev/null
          make install >/dev/null
          "$RUNNER_TEMP/nano-ref/bin/nano" --version | grep -m1 'GNU nano'

      - name: Build release candidate
        run: cargo build --release --locked --verbose

      - name: Run broad PTY byte-integrity suite
        env:
          REQUESTED_SEED: ${{ inputs.seed }}
          NANO_NO_UPDATE_CHECK: "1"
        run: |
          seed="${REQUESTED_SEED:-0x4E414E4F}"
          python3 scripts/pty_integrity.py \
            --candidate ./target/release/nano \
            --reference "$RUNNER_TEMP/nano-ref/bin/nano" \
            --profile broad \
            --seed "$seed" \
            --artifact-dir artifacts/pty-integrity

      - name: Upload PTY failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pty-integrity-broad-${{ github.run_id }}
          path: artifacts/pty-integrity
          if-no-files-found: ignore
          retention-days: 30
