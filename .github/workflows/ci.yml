name: CI

on:
  push:
    branches: [master, rust-port]
  pull_request:
    branches: [master, rust-port]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  default:
    name: Default tests, Clippy, and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-default-${{ hashFiles('Cargo.toml') }}

      - name: Check default production build
        run: cargo check --all-targets --verbose

      - name: Run default-feature tests
        run: cargo test --all-targets --verbose

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --verbose

      # Unit tests and Miri cannot see a startup crash that only happens in a
      # real interactive session (the 0.0.10 confirm_margin panic passed every
      # other gate).  Boot the release binary under a pty, with and without
      # line numbers, and require a rendered buffer and no panic.
      - name: Interactive startup smoke test under a pty
        run: |
          printf 'smoke line one\nsmoke line two\n' > /tmp/smoke.txt
          for flags in "" "-l"; do
            script -qec "timeout -k 4 2 ./target/release/nano $flags /tmp/smoke.txt" /dev/null \
              > /tmp/smoke.out 2>&1 || true
            if grep -a "panicked" /tmp/smoke.out; then
              echo "nano $flags panicked during interactive startup" >&2
              exit 1
            fi
            grep -aq "smoke line one" /tmp/smoke.out || {
              echo "nano $flags did not render the buffer" >&2
              exit 1
            }
            rm -f /tmp/.smoke.txt.swp
          done

  feature-matrix:
    name: Feature tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-default-features
            cargo_args: --no-default-features
          - name: tiny
            cargo_args: --no-default-features --features tiny
          - name: browser
            cargo_args: --no-default-features --features browser
          - name: libmagic
            cargo_args: --features libmagic
            needs_libmagic: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libmagic development files
        if: matrix.needs_libmagic == true
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libmagic-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.name }}-${{ hashFiles('Cargo.toml') }}

      - name: Check feature configuration
        run: cargo check --all-targets ${{ matrix.cargo_args }} --verbose

      - name: Test feature configuration
        run: cargo test --all-targets ${{ matrix.cargo_args }} --verbose

  windows-msvc:
    name: Windows MSVC native tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msvc-${{ hashFiles('Cargo.toml') }}

      - name: Check native Windows build
        run: cargo check --all-targets --target x86_64-pc-windows-msvc --verbose

      - name: Run native Windows tests
        run: cargo test --all-targets --target x86_64-pc-windows-msvc --verbose

      - name: Check minimal Windows build
        run: cargo check --all-targets --target x86_64-pc-windows-msvc --no-default-features --verbose

  miri:
    name: Miri state, text, cut, multibuffer, rendering, and input soundness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install nightly Rust and Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Prepare Miri sysroot
        run: cargo miri setup

      - name: Check AppState access under Miri
        run: cargo miri test global::appstate_access_tests -- --test-threads=1

      - name: Check line handles under Miri
        run: cargo miri test definitions::line_handle_tests -- --test-threads=1

      - name: Check nested help borrows under Miri
        run: cargo miri test help::tests -- --test-threads=1

      - name: Run rendering and input regression tests under Miri
        run: cargo miri test winio::tests -- --test-threads=1

      # The real-filesystem replacement test is ignored under Miri in the
      # source; the equivalent in-memory undo/redo test remains in this suite.
      - name: Run text and undo regression tests under Miri
        run: cargo miri test text::tests -- --test-threads=1

      - name: Run cut, paste, and cutbuffer tests under Miri
        run: cargo miri test cut::tests -- --test-threads=1

      - name: Check multibuffer ring traversal under Miri
        run: cargo miri test global::multibuffer_ring_tests -- --test-threads=1
