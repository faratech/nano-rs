[package]
name = "nano"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "nano"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
regex = "1"
libc = "0.2"
signal-hook = "0.3"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
unicode-segmentation = "1"
infer = { version = "0.16", optional = true }
tempfile = "3"

[features]
default = ["color", "nanorc", "utf8", "browser", "help", "histories",
           "justify", "multibuffer", "wrapping", "mouse",
           "linenumbers", "linter", "formatter", "speller",
           "tabcomp", "wordcomp", "comment", "libmagic", "operatingdir", "extra"]
tiny         = []
color        = []
nanorc       = []
utf8         = []
browser      = []
help         = []
histories    = []
justify      = []
multibuffer  = []
wrapping     = []
mouse        = []
linenumbers  = []
linter       = []
formatter    = []
speller      = []
tabcomp      = []
wordcomp     = []
comment      = []
libmagic     = ["dep:infer"]
operatingdir = []
extra        = []

# Windows-only: native GitHub-release self-updater (src/installer.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }

# Embeds Windows version metadata (media/nano.rc) via build.rs on Windows.
[build-dependencies]
embed-resource = "3"

# Speed-tuned release build (keeps opt-level at the default 3).
[profile.release]
lto = true
codegen-units = 1
strip = true
