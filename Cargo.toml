[package]
name = "nano"
version = "0.0.6"
edition = "2024"

[[bin]]
name = "nano"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
regex-lite = "0.1"
libc = "0.2"
unicode-width = "0.2"
infer = { version = "0.19", optional = true }
tempfile = "3"

[features]
# libmagic (the `infer` crate) is intentionally NOT in default — it adds ~35 KiB
# for a magic-bytes syntax fallback; build with `--features libmagic` to include it.
default = ["color", "nanorc", "utf8", "browser", "help", "histories",
           "justify", "multibuffer", "wrapping", "mouse",
           "linenumbers", "linter", "formatter", "speller",
           "tabcomp", "wordcomp", "comment", "operatingdir", "extra"]
tiny         = []
color        = []
nanorc       = []
utf8         = []
browser      = []
help         = []
histories    = []
justify      = []
multibuffer  = []
wrapping     = []
mouse        = []
linenumbers  = []
linter       = []
formatter    = []
speller      = []
tabcomp      = []
wordcomp     = []
comment      = []
libmagic     = ["dep:infer"]
operatingdir = []
extra        = []

# Windows-only: native GitHub-release self-updater (src/installer.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }

# Embeds Windows version metadata (media/nano.rc) via build.rs on Windows.
[build-dependencies]
embed-resource = "3"

# Size-tuned release build. opt-level="z" + panic="abort" trade run speed and
# unwinding for a much smaller binary; crash-time emergency save uses SIGSEGV/
# SIGABRT handlers (nano.rs), so abort-on-panic stays compatible.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
