[package]
name = "nano"
version = "0.0.15"
edition = "2024"

[[bin]]
name = "nano"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
cap-std = "4.0.2"
regex = { version = "1.13", default-features = false, features = ["std", "unicode"] }
libc = "0.2"
unicode-width = "0.2"
magic = { version = "0.16.7", optional = true }
tempfile = "3"
sha2 = "0.11"
glob = "0.3"
supports-color = "3.0.2"

[features]
# Native libmagic integration is intentionally not in the default feature set;
# build with `--features libmagic` when MIME/description matching is desired.
default = ["color", "nanorc", "utf8", "browser", "help", "histories",
           "justify", "multibuffer", "wrapping", "mouse",
           "linenumbers", "linter", "formatter", "speller",
           "tabcomp", "wordcomp", "comment", "operatingdir", "extra"]
tiny         = []
color        = []
nanorc       = []
utf8         = []
browser      = []
help         = []
histories    = []
justify      = []
multibuffer  = []
wrapping     = []
mouse        = []
linenumbers  = []
linter       = []
formatter    = []
speller      = []
tabcomp      = []
wordcomp     = []
comment      = []
libmagic     = ["dep:magic"]
operatingdir = []
extra        = []

# Windows-only: native GitHub-release self-updater (src/installer.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

# Embeds Windows version metadata (media/nano.rc) via build.rs on Windows.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
proptest = "1"

[patch.crates-io]
crossterm = { path = "vendor/crossterm-0.29.0" }

# Size-tuned release build. opt-level="z" + panic="abort" trade run speed and
# unwinding for a much smaller binary; crash-time emergency save uses SIGSEGV/
# SIGABRT handlers (nano.rs), so abort-on-panic stays compatible.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Speed-tuned build: `cargo build --profile perf` (binary in target/perf/nano).
# Same LTO/strip as release but opt-level=3 for run speed instead of size. This
# build is measurably faster than upstream C nano on the file-load path (~8%
# generic, ~13% with RUSTFLAGS="-Ctarget-cpu=native"); see scripts/build-fast.sh.
[profile.perf]
inherits = "release"
opt-level = 3
